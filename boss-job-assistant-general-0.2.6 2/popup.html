<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOSS 岗位助手</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup-page">
  <main class="popup">
    <p class="eyebrow">运行状态</p>
    <h1>BOSS 通用岗位助手</h1>
    <p class="community-banner">如果遇到使用上的问题或有优化建议，在抖音找：<strong>superorange7</strong>。欢迎大家提出建议，授权大家做二次开发和传播。</p>
    <section class="stats">
      <div><strong id="today-count">—</strong><span>今日成功发送</span></div>
      <div><strong id="history-count">—</strong><span>已记录岗位</span></div>
    </section>
    <p id="cooldown" class="status-box">正在读取…</p>
    <p id="automation" class="status-box">自动投放状态读取中…</p>
    <p class="help">岗位页：选择AI或模板并开始。消息页：扫描联系人，按已读/未读和沟通记录筛选，确认后批量激活。请勿与个人版同时启用。</p>
    <button id="open-options" class="primary full-button" type="button">打开设置</button>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
